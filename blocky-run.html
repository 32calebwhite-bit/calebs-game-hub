<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏃 Blocky Run</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(#16002b, #050505);
      color: white;
      text-align: center;
    }

    #topBar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding: 12px;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #topBar h1 {
      margin: 0;
      font-size: 22px;
    }

    #score {
      font-size: 18px;
      font-weight: bold;
    }

    #home {
      background: #8000ff;
      color: white;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 9px;
      font-weight: bold;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 0, 10, 0.9);
      padding: 20px;
    }

    #startScreen h2 {
      font-size: 45px;
      margin: 10px;
    }

    #startScreen p {
      color: #ccc;
      font-size: 18px;
    }

    #startButton {
      border: none;
      background: #8000ff;
      color: white;
      padding: 16px 35px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    #startButton:hover {
      background: #a64dff;
    }

    #jumpButton {
      position: fixed;
      right: 25px;
      bottom: 25px;
      z-index: 15;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid white;
      background: #8000ff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      touch-action: manipulation;
    }

    #gameOver {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 0, 10, 0.92);
    }

    #gameOver h2 {
      font-size: 45px;
      margin: 10px;
    }

    #restartButton {
      border: none;
      background: #8000ff;
      color: white;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      #topBar h1 {
        font-size: 17px;
      }

      #score {
        font-size: 15px;
      }

      #home {
        padding: 7px 10px;
        font-size: 13px;
      }

      #startScreen h2,
      #gameOver h2 {
        font-size: 35px;
      }
    }
  </style>

</head>

<body>

  <div id="topBar">
    <h1>🏃 Blocky Run</h1>

```
<div id="score">
  Score: 0 | Best: 0
</div>

<a
  id="home"
  href="https://32calebwhite-bit.github.io/calebs-game-hub/">
  🏠 HOME
</a>
```

  </div>

<canvas id="game"></canvas>

<button id="jumpButton">JUMP</button>

  <div id="startScreen">

```
<h2>🏃 BLOCKY RUN</h2>

<p>
  Jump over the blocks and survive as long as possible!
</p>

<p>
  🎮 Press SPACE or ↑ to jump
</p>

<button id="startButton">
  ▶ START GAME
</button>
```

  </div>

  <div id="gameOver">

```
<h2>💥 GAME OVER!</h2>

<p id="finalScore">
  Score: 0
</p>

<button id="restartButton">
  🔄 PLAY AGAIN
</button>
```

  </div>

    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const gameOverScreen = document.getElementById("gameOver");
    const restartButton = document.getElementById("restartButton");
    const jumpButton = document.getElementById("jumpButton");
    const finalScore = document.getElementById("finalScore");

    let W;

    function resizeCanvas() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    let player;
    let obstacles;
    let score;
    let speed;
    let gameRunning;
    let lastTime;
    let obstacleTimer;

    let bestScore =
      Number(localStorage.getItem("blockyRunBest")) || 0;

    scoreText.textContent =
      "Score: 0 | Best: " + bestScore;

    function createPlayer() {

      return {
        x: 100,
        y: H - 150,
        width: 45,
        height: 55,
        velocityY: 0,
        jumping: false
      };

    }

    function resetGame() {

      player = createPlayer();

      obstacles = [];

    function jump() {

      if (!gameRunning) return;

      if (!player.jumping) {

        player.velocityY = -15;

        player.jumping = true;

    document.addEventListener("keydown", function(event) {

      if (
        event.code === "Space" ||
        event.code === "ArrowUp"
      ) {

        event.preventDefault();

        jump();

      }

    });

    jumpButton.addEventListener("click", jump);

    jumpButton.addEventListener("touchstart", function(event) {

      event.preventDefault();

      jump();

    });

    function spawnObstacle() {

      const height =
        35 + Math.random() * 45;

      const width =
        30 + Math.random() * 30;

      obstacles.push({

        x: W + 50,

        y: H - 95 - height,

        width: width,

        height: height

      });

    }

    function collision(a, b) {

      return (

        a.x < b.x + b.width &&

        a.x + a.width > b.x &&

        a.y < b.y + b.height &&

        a.y + a.height > b.y

      );

    }

    function drawBackground() {

      ctx.fillStyle = "#080010";

      ctx.fillRect(0, 0, W, H);

      // Moon

      ctx.fillStyle = "#ffffff";

      ctx.beginPath();

      ctx.arc(
        W - 100,
        110,
        35,
        0,
        Math.PI * 2
      );

      ctx.fill();

      // Buildings

      for (
        let x = 0;
        x < W;
        x += 90
      ) {

        const height =
          100 + (x * 7 % 160);

        ctx.fillStyle = "#150025";

        ctx.fillRect(
          x,
          H - 80 - height,
          70,
          height
        );

        ctx.fillStyle = "#6500a0";

        for (
          let y = H - 60 - height;
          y < H - 100;
          y += 28
        ) {

          ctx.fillRect(
            x + 12,
            y,
            10,
            12
          );

          ctx.fillRect(
            x + 40,
            y,
            10,
            12
          );

        }

      }
